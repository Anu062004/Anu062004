name: Update profile contribution art

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install scraper dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Refresh contribution data and SVG
        env:
          GH_PROFILE_USER: Anu062004
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      - name: Commit refreshed art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.json contrib-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution art"
          git push
